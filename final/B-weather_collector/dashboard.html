<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Weather Dashboard</title>
<link href='https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap' rel='stylesheet'>
<script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
<style>
  body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  .container { width: 100%; max-width: 900px; }
  h1 { font-weight: 600; text-align: center; margin-bottom: 30px; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
  .card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 24px; text-align: center; backdrop-filter: blur(8px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2); transition: transform 0.2s; }
  .card:hover { transform: translateY(-4px); }
  .card h2 { margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; }
  .card .val { font-size: 48px; font-weight: 600; color: #38bdf8; }
  .card.humid .val { color: #34d399; }
  .card .time { font-size: 12px; color: #64748b; margin-top: 8px; }
  .chart-container { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 20px; margin-bottom: 30px; backdrop-filter: blur(8px); }
  table { width: 100%; border-collapse: collapse; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; overflow: hidden; margin-top: 20px; }
  th, td { padding: 12px 16px; text-align: left; }
  th { background: rgba(15, 23, 42, 0.8); color: #94a3b8; font-weight: 600; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
  tr:not(:last-child) td { border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
  tr:hover td { background: rgba(255, 255, 255, 0.02); }
</style>
</head>
<body>
<div class='container'>
  <h1>Weather Station Dashboard</h1>
  <div class='cards'>
    <div class='card temp'>
      <h2>Temperature</h2>
      <div class='val'>{{latest_temp}}&deg;C</div>
      <div class='time'>Last Updated: {{latest_time}}</div>
    </div>
    <div class='card humid'>
      <h2>Humidity</h2>
      <div class='val'>{{latest_humid}}%</div>
      <div class='time'>Last Updated: {{latest_time}}</div>
    </div>
  </div>
  <div class='chart-container'>
    <canvas id='weatherChart'></canvas>
  </div>
  <h3>Historical Data</h3>
  <table id='dataTable'>
    <thead>
      <tr>
        <th>Time</th>
        <th>Temperature (&deg;C)</th>
        <th>Humidity (%)</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
</div>
<script>
  const rawData = JSON.parse('{{json_data}}');
  // Render Table
  const tbody = document.querySelector('#dataTable tbody');
  [...rawData].reverse().slice(0, 15).forEach(d => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${d.time}</td><td>${d.temp.toFixed(1)}</td><td>${d.humid.toFixed(1)}</td>`;
    tbody.appendChild(tr);
  });
  // Render Chart
  const labels = rawData.map(d => d.time.split(' ')[1] || d.time);
  const temps = rawData.map(d => d.temp);
  const humids = rawData.map(d => d.humid);
  const ctx = document.getElementById('weatherChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        { label: 'Temperature (°C)', data: temps, borderColor: '#38bdf8', backgroundColor: 'rgba(56, 189, 248, 0.1)', tension: 0.3, yAxisID: 'yTemp', fill: true },
        { label: 'Humidity (%)', data: humids, borderColor: '#34d399', backgroundColor: 'rgba(52, 211, 153, 0.1)', tension: 0.3, yAxisID: 'yHumid', fill: true }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: '#94a3b8' } }
      },
      scales: {
        x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255, 255, 255, 0.05)' } },
        yTemp: { type: 'linear', position: 'left', ticks: { color: '#38bdf8' }, grid: { color: 'rgba(255, 255, 255, 0.05)' }, title: { display: true, text: 'Temp (°C)', color: '#38bdf8' } },
        yHumid: { type: 'linear', position: 'right', ticks: { color: '#34d399' }, grid: { drawOnChartArea: false }, title: { display: true, text: 'Humid (%)', color: '#34d399' } }
      }
    }
  });
</script>
</body>
</html>
